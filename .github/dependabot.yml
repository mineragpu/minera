version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The types follow the Node.js major the services run on (see .nvmrc), not the newest one.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /ops/web
      - /ops/coordinator
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      base-images:
        patterns:
          - '*'
